# media_hub sur TrueNAS Scale : Applications > Discover Apps > Custom App > « Install via YAML ».
#
# Deux conteneurs qui partagent le même réseau :
#   tailscale  seul accès distant : rend le serveur joignable en HTTPS (https://nas.<ton-tailnet>.ts.net), avec Funnel (serve.json,
#              AllowFunnel) donc par tout navigateur, sans Tailscale ; aucun autre port n'est ouvert vers l'extérieur ;
#   media_hub  le serveur de la médiathèque, qui écoute sur le port 8080.
# Sur la télé, à la maison : http://192.168.0.42:8080 (le port est publié sur le réseau local seulement).
#
# Remplace /mnt/tank/... par tes datasets. Les variables ${...} viennent du fichier .env voisin
# (copie .env.example en .env) ; avec l'éditeur YAML de TrueNAS, remplace-les directement par leurs valeurs.

name: media-hub

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: media-hub-tailscale
    hostname: nas                      # → https://nas.tail59c227.ts.net
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}        # clé jetable (Tailscale > Settings > Keys) ; inutile une fois l'état conservé
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"             # pas besoin de /dev/net/tun ni de privilèges
      TS_SERVE_CONFIG: /config/serve.json
    ports:
      - "8080:8080"                    # port du media_hub (même réseau), publié sur le réseau local pour la télé
    volumes:
      - ${APPS}/tailscale:/var/lib/tailscale
      - ${APPS}/tailscale-config/serve.json:/config/serve.json:ro   # copie serve.json à cet endroit (chemin absolu : TrueNAS n'a pas de dossier « courant »)

  media_hub:
    image: python:3.13-slim
    container_name: media-hub
    restart: unless-stopped
    network_mode: service:tailscale    # même réseau que tailscale : 127.0.0.1:8080 est joignable par `tailscale serve`
    depends_on:
      - tailscale
    # Le conteneur tourne en root : on lui ôte ce qu'il n'utilise pas. `no-new-privileges` empêche tout processus (ffmpeg, pip) de gagner des privilèges.
    # Deux capacités sont gardées : DAC_OVERRIDE (écrire ou effacer un fichier que root ne possède pas, ou dont les droits l'interdisent) et FOWNER (chmod / utime
    # sur un fichier d'un autre utilisateur du NAS : ce que fait « Supprimer » les fichiers parasites, et les scripts de media_library). Sans elles, avec un
    # `cap_drop: ALL` seul, ces opérations échoueraient dès que les fichiers appartiennent à un autre compte que root.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    working_dir: /app/media_hub
    # Pillow est facultatif (pochettes plus légères) : installé une seule fois dans le dossier de données (/data/pylib, déjà dans PYTHONPATH), puis réutilisé
    # sans réseau aux démarrages suivants. Si pip échoue, son message reste dans `docker logs media-hub` et le serveur démarre quand même, sans Pillow.
    # Pour réinstaller ou mettre Pillow à jour : supprimer le dossier media_hub-data/pylib et redémarrer.
    command: ["sh", "-c", "python -c 'import PIL' 2>/dev/null || pip install -q --disable-pip-version-check --target /data/pylib pillow || echo 'media_hub : Pillow non installé (facultatif)'; exec python -m hub"]
    environment:
      PYTHONPATH: /data/pylib
      PYTHONUNBUFFERED: "1"
      HUB_SRV: /srv
      HUB_DATA: /data
      HUB_REPO: /app/media_library
      HUB_FFMPEG: /opt/ffmpeg          # dossier qui contient ffmpeg et ffprobe (voir fetch-ffmpeg.sh)
      HUB_BIND: 0.0.0.0                # écoute aussi le réseau local : d'où le mot de passe obligatoire ci-dessous
      HUB_PORT: "8080"
      HUB_PASSWORD: "${HUB_PASSWORD:?définis HUB_PASSWORD dans le fichier .env (sinon le serveur serait ouvert à tout le réseau local)}"    # amorce le premier compte (administrateur) si la base n'en a aucun ; ensuite ignoré. Obligatoire : sans lui, `docker compose up` refuse de démarrer
      HUB_ADMIN: ${HUB_ADMIN:-admin}   # nom de ce premier compte (« admin » si absent du .env)
      HUB_MAX_STREAMS: "2"             # transcodages simultanés (i3-13100F : 2 flux 1080p sans souci)
      HUB_AUTOSCAN_HOURS: "6"
      # Boîte de réception (les envois des comptes qui ont le droit « Envoyer ») : un dossier par compte, nommé d'après lui, dans HUB_INBOX (par défaut
      # /data/inbox, donc dans media_hub-data), jamais dans une bibliothèque. Valeurs en Mo ; ni la taille d'un fichier ni le quota d'un compte n'ont de
      # limite : pour plafonner la boîte, une limite de dataset TrueNAS (sur media_hub-data, ou sur HubReception si la boîte a le sien : voir « Boîte de réception » dans README.md).
      # HUB_INBOX: /inbox                # boîte sur son propre dataset : à activer AVEC le montage « /mnt/tank/HubReception:/inbox » plus bas ; jamais réglable depuis l'interface
      HUB_INBOX_KEEP_FREE: "${HUB_INBOX_KEEP_FREE:-10240}"       # espace libre à garder sur le volume de la boîte (par défaut /data) : un envoi qui passerait en dessous est refusé
      HUB_INBOX_MAX_UPLOADS: "${HUB_INBOX_MAX_UPLOADS:-2}"       # envois simultanés
      TMDB_KEY: ${TMDB_KEY}
    volumes:
      - ${APPS}/media_hub:/app/media_hub:ro
      - ${APPS}/media_library:/app/media_library:ro
      - ${APPS}/media_hub-data:/data
      # Boîte de réception sur son propre dataset (facultatif) : décommente cette ligne ET « HUB_INBOX: /inbox » plus haut, ensemble. Crée d'abord le dataset
      # (README.md > « Boîte de réception ») : un montage vers un dossier qui n'existe pas empêche le conteneur de démarrer. Lecture et écriture, sans « :ro » :
      # c'est le seul volume inscriptible en dehors de media_hub-data. Remplace /mnt/tank/HubReception par ton dataset.
      # - /mnt/tank/HubReception:/inbox
      - ${APPS}/ffmpeg:/opt/ffmpeg:ro
      # Bibliothèques. « :ro » = lecture seule. Retire-le si tu veux que le bouton « Supprimer » (Gestion > Entretien) supprime les Thumbs.db,
      # ou que les scripts de media_library (étiquetage, renommage) tournent depuis ce conteneur.
      # Musique sans « :ro » aussi pour les photos d'artistes : « Valider » écrit artist.webp dans le dossier de l'artiste (sinon : erreur 500, la photo n'est pas enregistrée).
      - ${MEDIA}/Films:/srv/Films:ro
      - ${MEDIA}/Series:/srv/Series:ro
      - ${MEDIA}/Musique:/srv/Musique:ro
      - ${MEDIA}/Livres:/srv/Livres:ro
