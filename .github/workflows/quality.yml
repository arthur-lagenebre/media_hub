name: Qualité

# La passe rapide de « faire bien » du skill ub-mode, à chaque PR qui touche du Python de hub/ (environ 25 s) :
#   dryer : aucune duplication de score 0,8 ou plus dans hub/ (une paire se compare à tout hub/, pas seulement aux fichiers modifiés).
# crapper (21 min par PR) et mutator passent sur tout hub/ chaque nuit (nightly.yml) ; mutator se lance aussi
# à la demande sur une PR (étiquette « mutator », voir mutator.yml).
on:
  pull_request:
    paths:
      - "hub/**/*.py"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DRYER_REF: 66ff6d21a42c04afcad89c78a80066176d1294b0
  DRY_MIN: "0.8"

jobs:
  dryer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: media_hub
      - uses: actions/checkout@v7
        with:
          repository: unclebob/dryer
          ref: ${{ env.DRYER_REF }}
          path: dryer
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # dryer sort toujours 0 après un rapport : c'est la présence d'un « DUPLICATE » qui fait échouer.
      - name: Duplication
        working-directory: media_hub
        shell: bash
        run: |
          ../dryer/dryer --threshold "$DRY_MIN" hub | tee dryer.log
          if grep -q '^DUPLICATE' dryer.log; then
            echo "::error title=dryer::des paires de score $DRY_MIN ou plus : à factoriser (voir le journal)"
            exit 1
          fi
