name: Tests

# Les tests de la PR, sur Linux : le serveur sur les deux Python qui comptent (3.13 : celui du conteneur du NAS, 3.14 : celui du poste).
# L'interface (Chromium, Playwright) n'est plus testée ici : trop lente ; elle se lance à la main (`python -m unittest tests.test_ui tests.test_popups`).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  serveur:
    name: Serveur (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: media_hub
      - uses: ./media_hub/.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      # Sans Playwright, les tests d'interface sont ignorés (voir l'en-tête).
      - name: Tests du serveur
        working-directory: media_hub
        run: .venv/bin/python -W ignore -m unittest discover -s tests
