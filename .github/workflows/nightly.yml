name: Nuit

# Les passes longues de « faire bien » (skill ub-mode), sur tout hub/, une fois par nuit plutôt qu'à chaque PR :
#   crapper : aucune fonction de hub/ au-dessus de CRAP 10, avec l'interface dans Chromium (Playwright) pour la couverture ;
#   mutator : la passe de mutation, en cinq parties parallèles, sans Playwright, chacune avec son cache différentiel
#             et ses seuls modules de tests (toute la suite par mutant ne tenait pas dans un job : voir « tests »).
#             .github/scripts/mutate_part.py la lance fichier par fichier, et par tranches pour un long fichier :
#             une partie arrêtée à la limite du job reprend à la passe suivante.
# La nuit, rien ne se lance si ce commit de main a déjà été entièrement traité : crapper réussi et mutator allé au bout
# dans chaque partie, survivants ou non. À la main (onglet Actions), toujours.
on:
  schedule:
    - cron: "17 2 * * *"          # 2 h 17 UTC
  workflow_dispatch:

concurrency:
  group: nuit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read                   # lire les passes précédentes (job « changes »)

env:
  CRAP_MAX: "10"
  # Les deux outils ne sont pas versionnés : on les épingle, pour qu'une passe se rejoue à l'identique.
  # crapper l'est dans .github/actions/setup, au même commit que dans mutator.yml.
  MUTATOR_REF: a5a0cb803b66e0cdb8bf471b3b08af701d424a41

jobs:
  changes:
    name: main a-t-il bougé ?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      # « Traité » ne veut pas dire « vert » : un survivant fait échouer le job à sa dernière étape, mais l'étape Mutator
      # a réussi. Une partie annulée à la limite, ou dont la machine a disparu, n'est pas traitée et reprend.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TREATED: >-
            [.jobs[] | select(.name == "crapper")] as $crapper
            | [.jobs[] | select(.name | startswith("mutator"))] as $parts
            | ($crapper | length) == 1 and $crapper[0].conclusion == "success" and ($parts | length) > 0
            and ($parts | all(.steps | any(.name == "Mutator" and .conclusion == "success")))
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          [ "$EVENT" = "schedule" ] || exit 0
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs"
          for id in $(gh api "$runs?branch=main&head_sha=$GITHUB_SHA&status=completed&per_page=30" --jq '.workflow_runs[].id'); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq "$TREATED")" = "true" ]; then
              echo "::notice title=Nuit::commit $GITHUB_SHA déjà entièrement traité (run $id) : rien à faire"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

  crapper:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: media_hub
      - uses: ./media_hub/.github/actions/setup
        with:
          playwright: "true"      # le serveur est aussi exercé par l'interface : sans elle, la couverture serait plus basse qu'en local
          crapper: "true"
      - name: CRAP
        working-directory: media_hub
        env:
          # crapper lance `unittest discover` à la racine, qui importe aussi hub/scan : il lui faut `libraries` (media_library).
          PYTHONPATH: ${{ github.workspace }}/media_library
        shell: bash               # pipefail : le code de sortie de crapper passe malgré tee
        run: |
          # shellcheck disable=SC2046
          ../crapper/crapper --threshold "$CRAP_MAX" $(git ls-files 'hub/*.py') 2>&1 | tee crapper.log
      - name: Résumé
        if: always()
        working-directory: media_hub
        run: |
          [ -f crapper.log ] || exit 0
          {
            echo '```'
            tail -n 60 crapper.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  mutator:
    name: mutator (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # tests : les modules que mutator lance pour chaque mutant de la partie (motifs de fichiers sous tests/).
      # Toute la suite (2754 tests, 5 à 6 min) par mutant ne finissait pas en 350 min (run 44130082867).
      # Coût accepté : un mutant tué seulement par un test d'un autre module passe pour survivant.
      matrix:
        include:
          - part: serveur
            paths: hub/server
            tests: tests/test_server*.py tests/test_range.py tests/test_autoscan.py tests/test_jobs.py
          # scan et media ont fait perdre leur machine deux fois quand ils étaient ensemble (cause non établie : mémoire ?).
          # Séparés pour savoir lequel, moins de mutants à la fois, et une limite de mémoire par lancement de tests.
          - part: scan
            paths: hub/scan
            tests: tests/test_scan.py tests/test_video_scan.py
            workers: 2
            memory_mb: 4096
          - part: media
            paths: hub/media
            tests: >-
              tests/test_books.py tests/test_probe.py tests/test_images.py
              tests/test_tracks.py tests/test_subs.py tests/test_badges.py
            workers: 2
            memory_mb: 4096
          - part: donnees
            paths: hub/db.py hub/accounts.py hub/requests.py hub/inbox.py
            tests: tests/test_database.py tests/test_accounts.py tests/test_requests.py tests/test_inbox*.py
          # Le reste des modules de hub/ : calculé à l'exécution, en retirant ceux de « donnees » (garder les deux listes d'accord).
          # Sans « tests », chaque fichier a les siens (voir mutate_part.py).
          - part: reste
            paths: ""
            tests: ""
    steps:
      - uses: actions/checkout@v7
        with:
          path: media_hub
      # Sans Playwright : les tests d'interface sont ignorés, la passe reste dans le temps d'un runner.
      - uses: ./media_hub/.github/actions/setup
        with:
          crapper: "true"         # mutator lit les noms des fonctions avec crapper, posé à côté de lui
      - uses: actions/checkout@v7
        with:
          repository: unclebob/mutator
          ref: ${{ env.MUTATOR_REF }}
          path: mutator

      # Les survivants et les mutants tués d'une nuit servent à la suivante (passe différentielle), partie par partie.
      # Restauration et sauvegarde sont séparées : actions/cache ne sauvegarde qu'un job réussi, or mutator sort en 3
      # dès qu'un mutant survit ; chaque passe repartait alors de zéro (plusieurs heures). Voir « Garder les résultats ».
      - uses: actions/cache/restore@v6
        with:
          path: media_hub/.metrics/mutate
          key: mutate-nuit-${{ matrix.part }}-${{ github.run_id }}
          restore-keys: mutate-nuit-${{ matrix.part }}-

      - name: Fichiers à muter
        id: paths
        working-directory: media_hub
        env:
          PATHS: ${{ matrix.paths }}
        run: |
          if [ -z "$PATHS" ]; then
            PATHS=$(ls hub/*.py | grep -vxE 'hub/(db|accounts|requests|inbox)\.py' | tr '\n' ' ')
          fi
          echo "list=$PATHS" >> "$GITHUB_OUTPUT"

      - name: Mutator
        id: mutator
        working-directory: media_hub
        env:
          PATHS: ${{ steps.paths.outputs.list }}
          TESTS: ${{ matrix.tests }}
          WORKERS: ${{ matrix.workers }}
          MEMORY_MB: ${{ matrix.memory_mb }}
          # Les tests importent aussi hub/scan, qui a besoin de `libraries` avant que les tests ne le rendent importable.
          PYTHONPATH: ${{ github.workspace }}/media_library
        shell: bash               # pipefail : le code de sortie du lanceur passe malgré tee
        run: |
          # shellcheck disable=SC2086
          python -u .github/scripts/mutate_part.py --tests "$TESTS" --workers "$WORKERS" --memory-mb "$MEMORY_MB" $PATHS 2>&1 | tee mutator.log

      # Même quand la partie échoue ou s'arrête à la limite du job, ses résultats sont justes : on les garde pour la suivante.
      # Sans .metrics/mutate (aucun fichier ni tranche terminés), il n'y a rien à garder.
      - name: Garder les résultats
        if: always() && hashFiles('media_hub/.metrics/mutate/**') != ''
        uses: actions/cache/save@v6
        with:
          path: media_hub/.metrics/mutate
          key: mutate-nuit-${{ matrix.part }}-${{ github.run_id }}

      - name: Résumé
        if: always()
        working-directory: media_hub
        run: |
          [ -f mutator.log ] || exit 0
          {
            echo '```'
            tail -n 60 mutator.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutate-${{ matrix.part }}
          path: |
            media_hub/.metrics/mutate
            media_hub/.metrics/crap.edn
            media_hub/mutator.log

      # En dernier, pour que résultats et résumé soient gardés : le job reste rouge tant qu'un mutant survit.
      - name: Survivants
        if: steps.mutator.outputs.survived == 'true'
        run: |
          echo "::error title=mutator (${{ matrix.part }})::des mutants survivent : voir le résumé de ce job"
          exit 3
